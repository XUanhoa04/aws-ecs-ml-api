name: AWS lab lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy and verify, or destroy the workload
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ecs-ml-lab-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_environment: ${{ vars.ENVIRONMENT }}
  TF_VAR_image_tag: ${{ github.sha }}
  TF_IN_AUTOMATION: "true"

jobs:
  lifecycle:
    name: ${{ inputs.action }} dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Check bootstrap variables
        shell: bash
        run: |
          set -euo pipefail
          for variable in AWS_REGION TF_STATE_BUCKET TF_VAR_project_name TF_VAR_environment; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing GitHub variable: $variable"
              exit 1
            fi
          done
          if [[ -z "${{ vars.AWS_ROLE_ARN }}" ]]; then
            echo "Missing GitHub variable: AWS_ROLE_ARN"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ecs-ml-lab-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_VAR_project_name/$TF_VAR_environment.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Create ECR repository
        if: inputs.action == 'deploy'
        run: terraform -chdir=infra apply -auto-approve -input=false -target=aws_ecr_repository.api

      - name: Build and push immutable image
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          repository_url=$(terraform -chdir=infra output -raw ecr_repository_url)
          repository_name="$TF_VAR_project_name-$TF_VAR_environment"
          if aws ecr describe-images --repository-name "$repository_name" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image tag already exists; reusing $repository_url:$GITHUB_SHA"
          else
            aws ecr get-login-password | docker login --username AWS \
              --password-stdin "${repository_url%%/*}"
            docker build --build-arg "APP_VERSION=$GITHUB_SHA" \
              --tag "$repository_url:$GITHUB_SHA" .
            docker push "$repository_url:$GITHUB_SHA"
          fi

      - name: Deploy application
        if: inputs.action == 'deploy'
        run: terraform -chdir=infra apply -auto-approve -input=false

      - name: Smoke test
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          api_url=$(terraform -chdir=infra output -raw api_url)
          for attempt in {1..30}; do
            if curl --fail --silent "$api_url/health/ready"; then
              prediction=$(curl --fail --silent --request POST "$api_url/predict" \
                --header 'content-type: application/json' \
                --data '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}')
              printf '### Deployment verified\n- API: %s\n- Prediction JSON: %s\n' \
                "$api_url" "$prediction" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for ALB health, attempt $attempt/30"
            sleep 10
          done
          exit 1

      - name: Destroy workload
        if: inputs.action == 'destroy'
        run: terraform -chdir=infra destroy -auto-approve -input=false
